<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MPU6050 Visualization</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client/dist/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #topContainer {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            font-size: small;
        }

        #leftSide {
            min-width: 300px;
        }

        #pidCalibration {
            flex: 1;
            min-width: 300px;
            flex-direction: column;
            align-items: flex-start;
        }

        #constantsFormContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        #constantsFormContainer label {
            margin-right: 5px;
        }

        #checkboxContainer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
        }

        #checkboxContainer label {
            margin-left: 5px;
        }

        .pidGroup {
            display: grid;
            gap: 10px;
            margin-bottom: 5px;
        }

        .updateButton {
            margin: 10px 5px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            position: relative;
        }

        .updateButtonAlignment {
            display: flex;
            flex-direction: column;
            justify-content: baseline;
            align-items: flex-start;
        }

        .buttonRow {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .btnAdj {
            width: 25px;
            height: 25px;
            margin: 0px 5px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .divider {
            height: 1px;
            background-color: #ccc;
            margin: 20px 0;
        }

        .vertical-divider {
            width: 2px;
            background-color: #ccc;
            margin: 0 20px;
            align-self: stretch;
        }

        #chartContainer {
            position: relative;
            width: 80%;
            max-width: 1200px;
            height: 600px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
            cursor: pointer;
        }

        .tooltiptext {
            visibility: hidden;
            width: 130px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
        }

        body {
            margin: 25px;
        }


        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .status {
            &.running:before {
                background-color: #94E185;
                border-color: #78D965;
                box-shadow: 0px 0px 4px 1px #94E185;
            }

            &.standby:before {
                background-color: #FFC182;
                border-color: #FFB161;
                box-shadow: 0px 0px 4px 1px #FFC182;
            }
            
            &.disconnected:before {
                background-color: #C9404D;
                border-color: #C42C3B;
                box-shadow: 0px 0px 4px 1px #C9404D;
            }

            &:before {
                content: ' ';
                display: inline-block;
                width: 7px;
                height: 7px;
                margin-right: 10px;
                border: 1px solid #000;
                border-radius: 7px;
            }
        }
    </style>
</head>

<body>
    <div id="topContainer">
        <div>
            <h2>Balancing Robot Status Panel</h2>
            <h3 id="robotName">Connected to: <span></span></h3>
            <ul>
                <li id="status-running" class="status running">Running</li>
                <li id="status-standby" class="status standby">Standby</li>
                <li id="status-disconnected" class="status disconnected">Disconnected</li>
            </ul>
        </div>
        <div class="vertical-divider"></div>
        <div class="updateButtonAlignment">
            <div class="buttonRow">
                <button type="button" id="startRobotButton" class="updateButton">Start Robot</button>
                <button type="button" id="stopRobotButton" class="updateButton">Stop Robot</button>
                <button type="button" id="shutdownRobotButton" class="updateButton">Shutdown Robot</button>
            </div>
            <div class="buttonRow">
                <button type="button" id="startMotors" class="updateButton" title="Start multiprocessed motors">Start MP Motors</button>
                <button type="button" id="stopMotors" class="updateButton" title="Stop multiprocessed motors">Stop MP Motors</button>
                <button type="button" id="activateMotors" class="updateButton" title="Activate multiprocessed motors">Activate MP Motors</button>
                <button type="button" id="deactivateMotors" class="updateButton" title="Deactivate multiprocessed motors">Deactivate MP Motors</button>
            </div>
            <div>
                <button type="button" id="calibrateMpuButton" class="updateButton">Calibrate MPU</button>
                <button type="button" id="saveSettingsButton" class="updateButton">Save Settings</button>
            </div>
        </div>
        <div class="vertical-divider"></div>
        <div id="pidCalibration">
            <h3>PID Constants</h3>
            <div id="constantsForm">
                <div id="constantsFormContainer">
                    <div id="anglePIDGroup" class="pidGroup"></div>
                    <div id="positionPIDGroup" class="pidGroup"></div>
                </div>
                <div class="buttonRow">
                    <button type="button" id="sendConstantsButton" class="updateButton">Send Constants</button>
                    <button type="button" id="switchPosPidButton" class="updateButton">Turn On/Off Pos PID</button>
                </div>
            </div>
        </div>
    </div>
    <div class="divider"></div>
    <div id="topContainer">
        <div id="chartContainer">
            <canvas id="angleChart"></canvas>
        </div>
        <div id="leftSide">
            <h3>Trackable values</h3>
            <div id="checkboxContainer"></div>
            <div class="buttonRow">
                <button type="button" id="updateChartButton" class="updateButton">Update Chart</button>
                <button type="button" id="clearGraphButton" class="updateButton">Clear Graph</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () { initElements() };

        const ALL_KEYS = [
            "angle", "accel_angle", "gyro_angle", "target_angle",
            "a_pterm", "a_iterm", "a_dterm", "speed",
            "p_pterm", "p_iterm", "p_dterm", "pos_output",
            "avg_steps"
        ];

        const checkboxContainer = document.getElementById('checkboxContainer');
        ALL_KEYS.forEach(key => {
            const div = document.createElement('div');
            div.innerHTML = `<input type="checkbox" value="${key}" id="${key}"><label for="${key}">${key}</label>`;
            checkboxContainer.appendChild(div);
        });

        const ctx = document.getElementById('angleChart').getContext('2d');
        const angleChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: []
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: {
                        suggestedMin: -20,
                        suggestedMax: 20,
                    },
                    x: { display: false }
                },
                plugins: {
                    legend: { display: true }
                }
            }
        });

        const socket = io('/client');
        const maxDataPoints = 150;

        function initElements() {
            const angleKeys = [
                { key: 'ap', label: 'Angle P', min: 0.1, max: 15, step: 0.1 },
                { key: 'ai', label: 'Angle I', min: 0, max: 5, step: 0.01 },
                { key: 'ad', label: 'Angle D', min: 0, max: 0.3, step: 0.001 }
            ];
            const angleGroup = document.getElementById('anglePIDGroup');
            angleKeys.forEach(cfg => {
                const div = document.createElement('div');
                createSlider(div, cfg.label, cfg.min, cfg.max, cfg.step, cfg.key);
                angleGroup.appendChild(div);
            });

            const positionKeys = [
                { key: 'pp', label: 'Position P', min: 0, max: 1, step: 0.0001 },
                { key: 'pi', label: 'Position I', min: 0, max: 1, step: 0.0001 },
                { key: 'pd', label: 'Position D', min: 0, max: 1, step: 0.00001 }
            ];
            const positionGroup = document.getElementById('positionPIDGroup');
            positionKeys.forEach(cfg => {
                const div = document.createElement('div');
                createSlider(div, cfg.label, cfg.min, cfg.max, cfg.step, cfg.key);
                positionGroup.appendChild(div);
            });
        }

        function createSlider(div, name, min, max, stp, key) {
            div.className = "sliderGroup";

            var lbl = document.createElement("label");
            lbl.innerHTML = name;
            lbl.className = "nameLabel";
            div.appendChild(lbl);

            var btnMinus = document.createElement("button");
            btnMinus.type = "button";
            btnMinus.className = "btnAdj";
            btnMinus.innerHTML = '-';
            btnMinus.onclick = function () { changeValue(btnMinus, -1); };
            div.appendChild(btnMinus);

            var slider = document.createElement('input');
            slider.id = "slider_" + key;
            slider.type = 'range';
            slider.className = "slider";
            slider.min = min;
            slider.max = max;
            slider.step = stp;
            slider.value = (max - min) / 2;
            slider.oninput = function () { changeValue(btnMinus, 0); };
            div.appendChild(slider);

            var btnPlus = document.createElement("button");
            btnPlus.type = "button";
            btnPlus.className = "btnAdj";
            btnPlus.innerHTML = '+';
            btnPlus.onclick = function () { changeValue(btnPlus, 1); };
            div.appendChild(btnPlus);

            var valueLabel = document.createElement("label");
            valueLabel.id = "label_" + key;
            valueLabel.innerHTML = slider.value;
            valueLabel.className = "valueLabel";
            div.appendChild(valueLabel);
        }

        function changeValue(e, dir) {
            d = e.parentNode;
            s = d.getElementsByClassName("slider")[0];
            l = d.getElementsByClassName("valueLabel")[0];
            s.value = Number(s.value) + (dir * s.step);
            l.innerHTML = Number(s.value);
            var cmd = d.getAttribute('command');
        }

        function setValue(d, val) {
            s = d.getElementsByClassName("slider")[0];
            l = d.getElementsByClassName("valueLabel")[0];
            s.value = val;
            l.innerHTML = Number(val);
        }

        function parseValue(cmd, val) {
            d = document.getElementsByClassName("sliderGroup");
            for (var i = 0; i < d.length; i++) {
                if (d[i].getAttribute('command') == cmd) {
                    setValue(d[i], val);
                    return;
                }
            }
        }

        function getColor(index) {
            const COLORS = [
                '#ff0000', '#0000ff', '#00ff00', '#ffa500', '#4b0082',
                '#ee82ee', '#008080', '#800000', '#00ffff', '#ff1493',
                '#00ff00', '#ff4500', '#8b4513', '#ffff00', '#0000ff',
                '#808080', '#ff00ff', '#000000'
            ];
            return COLORS[index % COLORS.length];
        }

        function updateChart() {
            const selectedKeys = Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);

            // Remove datasets not in selected
            angleChart.data.datasets = angleChart.data.datasets.filter(ds => selectedKeys.includes(ds.label));

            // Add new datasets if needed
            selectedKeys.forEach((key, index) => {
                if (!angleChart.data.datasets.find(ds => ds.label === key)) {
                    angleChart.data.datasets.push({
                        label: key,
                        data: [],
                        borderColor: getColor(index),
                        fill: false,
                        tension: 0.1
                    });
                }
            });

            angleChart.update();
        }

        let robotConnected = true; // Assume connected initially until told otherwise
        let robotRunning = false;
        function updateStatusDisplay(isConnected, isRunning) {
            document.getElementById('status-running').style.display = (isConnected && isRunning) ? 'list-item' : 'none';
            document.getElementById('status-standby').style.display = (isConnected && !isRunning) ? 'list-item' : 'none';
            document.getElementById('status-disconnected').style.display = (!isConnected) ? 'list-item' : 'none';
        }

        socket.on('data', function (dataWrapper) {
            const data = dataWrapper.data || dataWrapper;
            angleChart.data.labels.push('');

            angleChart.data.datasets.forEach(dataset => {
                const val = data[dataset.label];
                dataset.data.push(val !== undefined ? val : null);

                if (dataset.data.length > maxDataPoints) {
                    dataset.data.shift();
                }
            });

            if (angleChart.data.labels.length > maxDataPoints) {
                angleChart.data.labels.shift();
            }

            angleChart.update('none');
        });

        socket.on('robot_data', function (data) {
            //'name'
            //'pid_constants'
            //'use_pos_pid' 
            //'running'
            Object.keys(data.pid_constants).forEach(function (key) {
                var slider = document.getElementById("slider_" + key);
                var label = document.getElementById("label_" + key);
                if (slider && label) {
                    slider.value = data.pid_constants[key];
                    label.innerHTML = Number(data.pid_constants[key]);
                }
                console.log(data.pid_constants[key])
            });

            if (data.name) {
                document.querySelector('#robotName span').textContent = data.name;
            }

            if (data.running) {
                robotRunning = true;
            } else {
                robotRunning = false;
            }
            updateStatusDisplay(robotConnected, robotRunning);
        });

        socket.on('robot_status', function (status) {
            if (status) {
                document.getElementById('startRobotButton').disabled = true;
                document.getElementById('stopRobotButton').disabled = false;
                robotRunning = true;
                updateStatusDisplay(robotConnected, robotRunning);
            } else {
                document.getElementById('startRobotButton').disabled = false;
                document.getElementById('stopRobotButton').disabled = true;
                robotRunning = false;
                updateStatusDisplay(robotConnected, robotRunning);
            }
        });

        socket.on('pos_Pid_status', function (status) {
            button = document.getElementById('switchPosPidButton')
            if (status) {
                button.innerHTML = 'Disable Pos PID'
            } else {
                button.innerHTML = 'Enable Pos PID'
            }
        });

        document.getElementById('startRobotButton').addEventListener('click', function () {
            socket.emit('start_robot');
        });

        document.getElementById('stopRobotButton').addEventListener('click', function () {
            socket.emit('stop_robot');
        });

        document.getElementById('shutdownRobotButton').addEventListener('click', function () {
            socket.emit('shutdown_robot');
        });

        document.getElementById('calibrateMpuButton').addEventListener('click', function () {
            socket.emit('calibrate_mpu');
        });

        document.getElementById('saveSettingsButton').addEventListener('click', function () {
            socket.emit('save_settings');
        });
        
        document.getElementById('switchPosPidButton').addEventListener('click', function () {
            socket.emit('switch_PosPid');
        });

        document.getElementById('startMotors').addEventListener('click', function () {
            socket.emit('start_motors');
        });

        document.getElementById('stopMotors').addEventListener('click', function () {
            socket.emit('stop_motors');
        });

        document.getElementById('activateMotors').addEventListener('click', function () {
            socket.emit('activate_motors');
        });

        document.getElementById('deactivateMotors').addEventListener('click', function () {
            socket.emit('deactivate_motors');
        });

        document.getElementById('sendConstantsButton').addEventListener('click', function () {
            const constants = {};
            ['ap', 'ai', 'ad', 'pp', 'pi', 'pd'].forEach(key => {
                constants[key] = parseFloat(document.getElementById("slider_" + key).value) || 0;
            });
            socket.emit('update_constants', constants);
        });

        document.getElementById('clearGraphButton').addEventListener('click', function () {
            angleChart.data.datasets.forEach(dataset => {
                dataset.data = [];
            });
            angleChart.update();
        });

        document.getElementById('updateChartButton').addEventListener('click', updateChart);
        updateChart();
    </script>
</body>

</html>
