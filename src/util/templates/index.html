<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MPU6050 Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client/dist/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #topContainer {
            display: flex;
            gap: 30px;
            max-width: 1600px;
            margin-bottom: 5px;
            font-size: small;
        }

        #leftSide {
            flex: 1;
            min-width: 300px;
        }

        #rightSide {
            flex: 1;
            min-width: 300px;
            flex-direction: column;
            align-items: flex-start;
        }

        #constantsFormContainer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        #constantsFormContainer label {
            margin-right: 5px;
        }

        #checkboxContainer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
        }

        #checkboxContainer label {
            margin-left: 5px;
        }

        .updateButton {
            margin: 10px 0;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            ;
        }

        .updateButtonAlignment {
            display: flex;
            justify-content: baseline;
            align-items: baseline;
        }

        .divider {
            height: 1px;
            background-color: #ccc;
            margin: 20px 0;
        }

        .vertical-divider {
            width: 2px;
            background-color: #ccc;
            margin: 0 20px;
            align-self: stretch;
        }

        #chartContainer {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div id="topContainer">
        <div id="leftSide">
            <h3>Trackable values</h3>
            <div id="checkboxContainer"></div>
            <div class="updateButtonAlignment"><button type="button" id="updateChartButton" class="updateButton">Update
                    Chart</button></div>
        </div>
        <div class="vertical-divider"></div>
        <div id="rightSide">
            <h3>PID Constants</h3>
            <form id="constantsForm">
                <div id="constantsFormContainer">
                    <div><label for="ap">Ap</label><input type="text" id="ap" name="Ap"></div>
                    <div><label for="ai">Ai</label><input type="text" id="ai" name="Ai"></div>
                    <div><label for="ad">Ad</label><input type="text" id="ad" name="Ad"></div>
                    <div><label for="pp">Pp</label><input type="text" id="pp" name="Pp"></div>
                    <div><label for="pi">Pi</label><input type="text" id="pi" name="Pi"></div>
                    <div><label for="pd">Pd</label><input type="text" id="pd" name="Pd"></div>
                </div>
                <div class="updateButtonAlignment"><button type="button" id="sendConstantsButton"
                        class="updateButton">Send Constants</button></div>
            </form>
        </div>
    </div>
    <div class="divider"></div>
    <div id="chartContainer">
        <canvas id="angleChart"></canvas>
    </div>

    <script>
        const ALL_KEYS = [
            "angle", "accel_angle", "gyro_angle", "target_angle",
            "a_pterm", "a_iterm", "a_dterm", "speed",
            "p_pterm", "p_iterm", "p_dterm", "pos_output",
            "avg_steps", "avg_steps_per_second"
        ];

        const checkboxContainer = document.getElementById('checkboxContainer');
        ALL_KEYS.forEach(key => {
            const div = document.createElement('div');
            div.innerHTML = `<input type="checkbox" value="${key}" id="${key}"><label for="${key}">${key}</label>`;
            checkboxContainer.appendChild(div);
        });

        const ctx = document.getElementById('angleChart').getContext('2d');
        const angleChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: []
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { beginAtZero: false },
                    x: { display: false }
                },
                plugins: {
                    legend: { display: true }
                }
            }
        });

        const socket = io();
        const maxDataPoints = 150;

        function getColor(index) {
            const COLORS = [
                '#ff0000', '#0000ff', '#00ff00', '#ffa500', '#4b0082',
                '#ee82ee', '#008080', '#800000', '#00ffff', '#ff1493',
                '#00ff00', '#ff4500', '#8b4513', '#ffff00', '#0000ff',
                '#808080', '#ff00ff', '#000000'
            ];
            return COLORS[index % COLORS.length];
        }

        function updateChart() {
            const selectedKeys = Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);

            // Remove datasets not in selected
            angleChart.data.datasets = angleChart.data.datasets.filter(ds => selectedKeys.includes(ds.label));

            // Add new datasets if needed
            selectedKeys.forEach((key, index) => {                
                if (!angleChart.data.datasets.find(ds => ds.label === key)) {
                    angleChart.data.datasets.push({
                        label: key,
                        data: [],
                        borderColor: getColor(index),
                        fill: false,
                        tension: 0.1
                    });
                }
            });

            angleChart.update();
        }

        socket.on('data', function (dataWrapper) {
            const data = dataWrapper.data || dataWrapper;

            angleChart.data.labels.push('');

            angleChart.data.datasets.forEach(dataset => {
                const val = data[dataset.label];
                dataset.data.push(val !== undefined ? val : null);

                if (dataset.data.length > maxDataPoints) {
                    dataset.data.shift();
                }
            });

            if (angleChart.data.labels.length > maxDataPoints) {
                angleChart.data.labels.shift();
            }

            angleChart.update('none');
        });

        socket.on('current_constants', function(constants) {
            ['ap', 'ai', 'ad', 'pp', 'pi', 'pd'].forEach(key => {
                if (constants[key] !== undefined) {
                    document.getElementById(key).value = constants[key];
                }
            });
        });

        document.getElementById('sendConstantsButton').addEventListener('click', function () {
            const constants = {};
            ['ap', 'ai', 'ad', 'pp', 'pi', 'pd'].forEach(key => {
                constants[key] = parseFloat(document.getElementById(key).value) || 0;
            });
            socket.emit('update_constants', constants);
        });

        document.getElementById('updateChartButton').addEventListener('click', updateChart);
        updateChart();
    </script>
</body>

</html>
